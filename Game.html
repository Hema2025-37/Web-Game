<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #f0f4f8;
    }

    h1 {
      color: #2c3e50;
    }

    h2 {
      color: #34495e;
      margin-top: 30px;
    }

    .button-container {
      margin: 15px 0;
    }

    .button-container button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 8px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      transition: 0.3s;
    }

    .button-container button:hover {
      background-color: #2980b9;
    }

    .highlight {
      background-color: #f1c40f !important;
      color: black;
      font-weight: bold;
    }

    #result {
      font-size: 20px;
      margin-top: 20px;
      color: #2c3e50;
    }

    #score {
      font-size: 18px;
      margin-top: 10px;
      color: #34495e;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Rock, Paper, Scissors Game</h1>

  <h2>Your Choice</h2>
  <div class="button-container">
    <button onclick="play('Rock')">Rock</button>
    <button onclick="play('Paper')">Paper</button>
    <button onclick="play('Scissors')">Scissors</button>
  </div>

  <h2>Computer's Choice</h2>
  <div class="button-container">
    <button id="comp-Rock" disabled>Rock</button>
    <button id="comp-Paper" disabled>Paper</button>
    <button id="comp-Scissors" disabled>Scissors</button>
  </div>

  <div id="result"></div>
  <div id="score">You: 0 | Computer: 0</div>

  <footer>
    &copy; 2025 Rock Paper Scissors | Simple JS Game Demo
  </footer>

  <script>
    let userScore = 0;
    let computerScore = 0;

    function play(userChoice) {
      const choices = ["Rock", "Paper", "Scissors"];
      const computerChoice = choices[Math.floor(Math.random() * 3)];

      // Clear previous highlights
      choices.forEach(choice => {
        document.getElementById("comp-" + choice).classList.remove("highlight");
      });

      // Highlight computer's choice
      document.getElementById("comp-" + computerChoice).classList.add("highlight");

      // Determine winner
      let resultMessage = `You chose ${userChoice}. Computer chose ${computerChoice}. `;

      if (userChoice === computerChoice) {
        resultMessage += "It's a draw!";
      } else if (
        (userChoice === "Rock" && computerChoice === "Scissors") ||
        (userChoice === "Paper" && computerChoice === "Rock") ||
        (userChoice === "Scissors" && computerChoice === "Paper")
      ) {
        resultMessage += "You win!";
        userScore++;
      } else {
        resultMessage += "Computer wins!";
        computerScore++;
      }

      // Update result and score
      document.getElementById("result").textContent = resultMessage;
      document.getElementById("score").textContent = `You: ${userScore} | Computer: ${computerScore}`;
    }
  </script>

</body>
</html>
